name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # The tests reach neither the network nor a terminal, so they need no
      # gh binary and no TTY on the runner.
      - name: test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Pinned rather than left to float: golangci-lint refuses a module whose
      # Go version is newer than the one the linter itself was built with, so
      # an older default here fails the job before it lints anything. v2 is
      # also the schema .golangci.yml is written in.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
